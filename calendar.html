<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OCR — Calendar</title>
<script src="theme.js"></script>
<script src="loading.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #F4F5F7;
    --surface: #FFFFFF;
    --surface-2: #F9FAFB;
    --text: #1A1D23;
    --text-muted: #6B7280;
    --border: #E2E4E9;
    --accent: #A8452F;
    --accent-hover: #8F3B28;
    --success: #15803D;
    --success-bg: #DCFCE7;
    --danger: #B91C1C;
    --danger-bg: #FEE2E2;
    --warn: #B45309;
    --warn-bg: #FEF3C7;
    --info: #1D4ED8;
    --info-bg: #DBEAFE;
    --radius: 14px;
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --display-font: "Anton", var(--font);
  }

  :root[data-theme="dark"] {
    --bg: #15171B;
    --surface: #1E2126;
    --surface-2: #262A31;
    --text: #ECEDEF;
    --text-muted: #9AA0AC;
    --border: #33373F;
    --accent: #C2573D;
    --accent-hover: #D66748;
    --success: #22C55E;
    --success-bg: #123320;
    --danger: #F87171;
    --danger-bg: #3A1518;
    --warn: #FBBF24;
    --warn-bg: #3A2A0C;
    --info: #60A5FA;
    --info-bg: #122A4A;
  }

  * { box-sizing: border-box; }

  #page-loader {
    position: fixed;
    inset: 0;
    z-index: 2000;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.25s ease;
  }
  #page-loader.hide { opacity: 0; pointer-events: none; }
  .page-loader-mark {
    font-family: "Poppins", var(--font);
    font-weight: 800;
    font-size: 32px;
    letter-spacing: 0.03em;
    color: #FFFFFF;
    animation: pulse-swell 1.3s ease-in-out infinite;
  }
  @keyframes pulse-swell {
    0%, 100% { transform: scale(0.92); opacity: 0.6; }
    50% { transform: scale(1.08); opacity: 1; }
  }

  body {
    margin: 0;
    font-family: var(--font);
    background: var(--bg) center / cover fixed no-repeat;
    color: var(--text);
    min-height: 100vh;
  }

  .container { max-width: 1400px; margin: 0 auto; padding: 20px 16px 60px; }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 12px;
  }
  .topbar-brand { display: flex; align-items: center; grid-column: 2; justify-self: center; }
  .topbar-brand-link { display: flex; align-items: center; gap: 8px; text-decoration: none; color: inherit; cursor: pointer; }
  .theme-toggle-wrap { grid-column: 1; justify-self: start; }
  .theme-switch { display: inline-flex; cursor: pointer; }
  #theme-toggle-checkbox { position: absolute; opacity: 0; width: 0; height: 0; }
  .theme-switch-track {
    position: relative; width: 52px; height: 26px; background: var(--surface-2);
    border: 1px solid var(--border); border-radius: 999px; display: flex;
    align-items: center; justify-content: space-between; padding: 0 6px;
  }
  .theme-switch-icon { width: 13px; height: 13px; color: var(--text-muted); z-index: 1; flex-shrink: 0; }
  .theme-switch-thumb {
    position: absolute; top: 2px; left: 2px; width: 20px; height: 20px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 50%;
    box-shadow: 0 1px 2px rgba(0,0,0,0.2); transition: transform 0.2s ease; z-index: 2;
  }
  #theme-toggle-checkbox:checked + .theme-switch-track .theme-switch-thumb { transform: translateX(26px); }
  .topbar .topbar-right { grid-column: 3; justify-self: end; display: flex; align-items: center; gap: 10px; }
  .topbar .admin-area { display: flex; align-items: center; gap: 8px; }
  .quickadd-btn {
    background: var(--accent); color: white; border: none; border-radius: var(--radius);
    padding: 10px 18px; font-weight: 700; font-size: 13px; white-space: nowrap;
    text-decoration: none; display: inline-block; cursor: pointer; letter-spacing: 0.01em;
  }
  .quickadd-btn:hover { background: var(--accent-hover); }
  .brand-logo { height: 40px; width: auto; object-fit: contain; }
  .toggle-btn {
    font-family: var(--font); font-size: 13px; padding: 9px 14px; border: 1px solid var(--border);
    border-radius: var(--radius); background: var(--surface); color: var(--text-muted); white-space: nowrap;
    cursor: pointer;
  }
  .admin-status { font-size: 12px; color: var(--text-muted); margin-right: 2px; }
  .breadcrumb {
    font-size: 14px; font-weight: 600; color: var(--text-muted); text-decoration: none;
    margin-bottom: 12px; display: inline-block; background: var(--surface);
    padding: 10px 18px; border-radius: 999px;
  }
  .breadcrumb:hover { color: var(--text); }
  .btn-primary {
    background: var(--accent); color: white; border: none; border-radius: var(--radius);
    padding: 11px 20px; font-weight: 500; cursor: pointer;
  }
  .btn-primary:hover { background: var(--accent-hover); }

  #confirm-banner {
    display: none; padding: 10px 14px; border-radius: var(--radius); font-size: 14px;
    margin-bottom: 16px; background: var(--success-bg); color: var(--success);
  }
  #confirm-banner.error { background: var(--danger-bg); color: var(--danger); }

  .field { margin-bottom: 14px; }
  .field > label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 5px; }
  .field input {
    width: 100%; font-family: var(--font); font-size: 16px; padding: 8px 10px;
    border: 1px solid var(--border); border-radius: 12px; background: #FFFFFF; color: #1A1D23;
  }
  .field input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  #auth-gate { display: flex; align-items: center; justify-content: center; min-height: 50vh; padding: 24px 0; }
  .auth-gate-card {
    width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; padding: 28px;
  }
  .auth-gate-card h1 { font-size: 19px; margin: 0 0 6px; }
  .auth-gate-card .subtitle { font-size: 13px; color: var(--text-muted); margin: 0 0 18px; }
  #gate-error {
    display: none; font-size: 13px; color: var(--danger); background: var(--danger-bg);
    padding: 10px 12px; border-radius: 10px; margin-bottom: 14px;
  }

  .empty-state { padding: 32px 14px; text-align: center; color: var(--text-muted); font-size: 14px; }

  .calendar-layout {
    display: flex;
    gap: 20px;
    align-items: flex-start;
  }
  @media (max-width: 900px) {
    .calendar-layout { flex-direction: column; }
  }

  .agenda-panel {
    flex: 0 0 340px;
    max-width: 340px;
  }
  @media (max-width: 900px) {
    .agenda-panel { flex: 1 1 auto; max-width: 100%; order: 2; }
  }

  .grid-panel {
    flex: 1 1 auto;
    min-width: 0;
  }
  @media (max-width: 900px) {
    .grid-panel { order: 1; }
  }

  .agenda-group { margin-bottom: 18px; }
  .agenda-date-header {
    font-size: 12px; font-weight: 700; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 8px; padding-left: 4px;
  }
  .agenda-date-header.status-overdue { color: var(--danger); }
  .agenda-date-header.status-soon { color: var(--warn); }
  .agenda-date-header.status-future { color: var(--info); }
  .agenda-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden;
  }
  .agenda-row-btn {
    width: 100%; display: flex; justify-content: space-between; align-items: center;
    gap: 10px; padding: 12px 14px; border: none; border-bottom: 1px solid var(--border);
    background: none; text-align: left; cursor: pointer; font-family: var(--font); color: var(--text);
  }
  .agenda-card > div:last-child .agenda-row-btn { border-bottom: none; }
  .agenda-row-btn:hover { background: var(--surface-2); }
  .agenda-row-name { font-weight: 600; font-size: 14px; }
  .agenda-row-owner { font-size: 12px; color: var(--text-muted); margin-top: 1px; }
  .agenda-row-chevron { transition: transform 0.15s ease; color: var(--text-muted); flex-shrink: 0; }
  .agenda-row-chevron.open { transform: rotate(180deg); }
  .agenda-detail {
    display: none; padding: 4px 14px 14px; font-size: 13px; border-bottom: 1px solid var(--border);
    background: var(--surface-2);
  }
  .agenda-detail.open { display: block; }
  .agenda-detail-item { margin-bottom: 8px; }
  .agenda-detail-item:last-child { margin-bottom: 0; }
  .agenda-detail-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 2px; }

  .grid-header {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 10px;
  }
  .grid-month-label { font-family: var(--display-font); font-size: 26px; margin: 0; }
  .grid-nav { display: flex; gap: 8px; align-items: center; }
  .grid-nav-btn {
    width: 34px; height: 34px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); cursor: pointer; font-size: 15px;
    display: flex; align-items: center; justify-content: center;
  }
  .grid-nav-btn:hover { background: var(--surface-2); }
  .grid-today-btn {
    padding: 8px 16px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); cursor: pointer; font-size: 13px; font-weight: 600;
  }
  .grid-today-btn:hover { background: var(--surface-2); }

  .grid-table {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden;
  }
  .grid-weekday-row { display: grid; grid-template-columns: repeat(7, 1fr); border-bottom: 1px solid var(--border); }
  .grid-weekday {
    padding: 10px 6px; text-align: center; font-size: 11px; font-weight: 700;
    color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.03em;
  }
  .grid-week-row { display: grid; grid-template-columns: repeat(7, 1fr); }
  .grid-day-cell {
    min-height: 84px; padding: 6px; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border);
    cursor: pointer; display: flex; flex-direction: column; gap: 4px;
  }
  .grid-day-cell:hover { background: var(--surface-2); }
  .grid-week-row .grid-day-cell:last-child { border-right: none; }
  .grid-day-cell.other-month { opacity: 0.35; }
  .grid-day-number {
    font-size: 12px; font-weight: 600; color: var(--text-muted); width: 22px; height: 22px;
    display: flex; align-items: center; justify-content: center; border-radius: 50%;
  }
  .grid-day-cell.is-today .grid-day-number { background: var(--accent); color: white; }
  .grid-day-pill {
    font-size: 10px; padding: 2px 6px; border-radius: 6px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; font-weight: 600;
  }
  .grid-day-pill.status-overdue { background: var(--danger-bg); color: var(--danger); }
  .grid-day-pill.status-soon { background: var(--warn-bg); color: var(--warn); }
  .grid-day-pill.status-future { background: var(--info-bg); color: var(--info); }
  .grid-day-more { font-size: 10px; color: var(--text-muted); padding-left: 2px; }

  @media (max-width: 600px) {
    .grid-day-cell { min-height: 56px; }
    .grid-day-pill { display: none; }
    .grid-day-dot {
      display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 3px;
    }
    .grid-day-dot.status-overdue { background: var(--danger); }
    .grid-day-dot.status-soon { background: var(--warn); }
    .grid-day-dot.status-future { background: var(--info); }
  }
  @media (min-width: 601px) {
    .grid-day-dot { display: none; }
  }
</style>
</head>
<body>

<div id="page-loader"><div class="page-loader-mark">OCR</div></div>


<div class="topbar">
  <div class="theme-toggle-wrap">
    <label class="theme-switch" aria-label="Toggle dark mode">
      <input type="checkbox" id="theme-toggle-checkbox" />
      <span class="theme-switch-track">
        <svg class="theme-switch-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span class="theme-switch-thumb"></span>
        <svg class="theme-switch-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
      </span>
    </label>
  </div>
  <div class="topbar-brand">
    <a class="topbar-brand-link" id="brand-link" href="campuses.html" aria-label="Back to seasons">
      <span class="ocr-wordmark-fallback" id="wordmark-fallback" style="font-family:'Poppins',var(--font);font-weight:800;font-size:20px;letter-spacing:0.02em;">OCR</span>
      <img id="topbar-logo" class="brand-logo" alt="OCR logo" style="display:none;" />
    </a>
  </div>
  <div class="topbar-right">
    <a class="quickadd-btn" id="quickadd-link" href="quick-add.html">+ Quick Add</a>
    <div class="admin-area" id="admin-area"></div>
  </div>
</div>

<div class="container">
  <div id="auth-gate">
    <div class="auth-gate-card">
      <h1>Sign in to continue</h1>
      <p class="subtitle">Viewing the calendar requires a member or admin login.</p>
      <div id="gate-error"></div>
      <form id="gate-form">
        <div class="field">
          <label for="gate-email">Email</label>
          <input id="gate-email" type="email" required />
        </div>
        <div class="field">
          <label for="gate-password">Password</label>
          <input id="gate-password" type="password" required />
        </div>
        <button type="submit" id="gate-submit-btn" class="btn-primary" style="width:100%;">Sign in</button>
      </form>
    </div>
  </div>

  <div id="app-content" style="display:none;">
    <a href="index.html" id="back-link" class="breadcrumb" style="display:none;">&larr; Tracker</a>
    <span id="calendar-title-link" class="breadcrumb" style="display:none; margin-left:8px; color:var(--text);">Calendar</span>

    <div id="confirm-banner"></div>

    <div id="calendar-loading-state" class="empty-state" style="background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);">Loading reminders…</div>

    <div id="calendar-layout" class="calendar-layout" style="display:none;">
      <div class="agenda-panel">
        <div id="agenda-empty-state" class="empty-state" style="display:none; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);">No follow-up reminders set for this season yet.</div>
        <div id="agenda-list"></div>
      </div>

      <div class="grid-panel">
        <div class="grid-header">
          <h1 class="grid-month-label" id="grid-month-label"></h1>
          <div class="grid-nav">
            <button type="button" class="grid-nav-btn" id="grid-prev-btn" aria-label="Previous month">&lsaquo;</button>
            <button type="button" class="grid-today-btn" id="grid-today-btn">Today</button>
            <button type="button" class="grid-nav-btn" id="grid-next-btn" aria-label="Next month">&rsaquo;</button>
          </div>
        </div>
        <div class="grid-table">
          <div class="grid-weekday-row" id="grid-weekday-row"></div>
          <div id="grid-weeks"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  window.addEventListener("error", (e) => {
    hidePageLoader();
    const loader = document.getElementById("page-loader");
    if (loader) {
      loader.innerHTML = `<div style="max-width:320px; text-align:center; padding:20px; font-size:14px; color:#333;">
        Something went wrong loading this page:<br><br>
        <code style="font-size:12px;">${(e.message || "unknown error").replace(/</g, "&lt;")}</code>
      </div>`;
      loader.classList.remove("hide");
      loader.style.background = "#fff";
    }
  });

  const SUPABASE_URL = "https://xyoniqfmujidoxpgcjlo.supabase.co";
  const SUPABASE_KEY = "sb_publishable_7Gl5gI5XAsMWxNLreYoMvA__2y-gpCC";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, m => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[m]));
  }

  const banner = document.getElementById("confirm-banner");
  function showBanner(message, isError) {
    banner.textContent = message;
    banner.className = isError ? "error" : "";
    banner.style.display = "block";
    clearTimeout(showBanner._timer);
    showBanner._timer = setTimeout(() => { banner.style.display = "none"; }, 4000);
  }

  const adminArea = document.getElementById("admin-area");
  const backLink = document.getElementById("back-link");
  const calendarTitleLink = document.getElementById("calendar-title-link");

  const seasonId = new URLSearchParams(window.location.search).get("season");
  let currentCampusId = new URLSearchParams(window.location.search).get("campus");

  if (!seasonId) {
    window.location.href = "campuses.html";
  }

  const quickAddLink = document.getElementById("quickadd-link");
  if (quickAddLink && seasonId) {
    quickAddLink.href = `quick-add.html?season=${seasonId}&return=dashboard`;
  }

  let isSignedIn = false;
  let isAdmin = false;
  let contacts = [];
  let currentMonthDate = new Date();
  currentMonthDate.setDate(1);

  function getIsAdminFromSession(session) {
    return !!(session && session.user && session.user.app_metadata && session.user.app_metadata.role === "admin");
  }

  function updateAdminUI() {
    if (!isSignedIn) {
      adminArea.innerHTML = "";
      return;
    }
    const label = isAdmin ? "Signed in as admin" : "Signed in as member";
    adminArea.innerHTML = `<span class="admin-status">${label}</span><button id="signout-btn" class="toggle-btn">Sign out</button>`;
  }

  adminArea.addEventListener("click", async (e) => {
    if (e.target.id === "signout-btn") {
      await sb.auth.signOut();
      isSignedIn = false;
      isAdmin = false;
      document.getElementById("app-content").style.display = "none";
      document.getElementById("auth-gate").style.display = "flex";
      updateAdminUI();
      showBanner("Signed out", false);
    }
  });

  async function loadSeasonContext() {
    if (!seasonId) return;
    const { data, error } = await sb.from("seasons").select("*").eq("id", seasonId).single();
    if (error || !data) return;

    if (!currentCampusId) currentCampusId = data.campus_id;
    backLink.href = `index.html?season=${seasonId}&campus=${currentCampusId}`;
    backLink.style.display = "inline-block";
    calendarTitleLink.style.display = "inline-block";
    const brandLink = document.getElementById("brand-link");
    if (brandLink) brandLink.href = `seasons.html?campus=${currentCampusId}`;

    const bgUrl = data.background_override_url || data.photo_url;
    if (bgUrl) document.body.style.backgroundImage = `url("${bgUrl}")`;

    if (data.logo_url) {
      const topbarLogo = document.getElementById("topbar-logo");
      const wordmark = document.getElementById("wordmark-fallback");
      topbarLogo.onload = () => { topbarLogo.style.display = "block"; wordmark.style.display = "none"; };
      topbarLogo.onerror = () => { topbarLogo.style.display = "none"; wordmark.style.display = "block"; };
      topbarLogo.src = data.logo_url;
    }
  }

  function reminderStatus(dateStr) {
    if (!dateStr) return "none";
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const d = new Date(dateStr + "T00:00:00");
    const diffDays = Math.round((d - today) / 86400000);
    if (diffDays < 0) return "overdue";
    if (diffDays <= 3) return "soon";
    return "future";
  }

  function statusLabel(status) {
    if (status === "overdue") return "Overdue";
    if (status === "soon") return "Due soon";
    return "Upcoming";
  }

  function formatDateHeader(dateStr) {
    const d = new Date(dateStr + "T00:00:00");
    return d.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
  }

  function interestsSummary(c) {
    const list = [];
    if (c.interest_event) list.push("Event");
    if (c.interest_lg) list.push("LG");
    if (c.interest_church) list.push("Church");
    return list.length ? list.join(", ") : "—";
  }

  function followupOwnerDisplay(c) {
    if (c.followup_owner_type === "suggested") return c.suggested_connection || "Suggested point person (not set)";
    if (c.followup_owner_type === "other") return c.followup_owner_other || "";
    return c.connector || "Current point person (not set)";
  }

  async function loadReminders() {
    const loadingEl = document.getElementById("calendar-loading-state");
    const layoutEl = document.getElementById("calendar-layout");
    loadingEl.style.display = "block";
    layoutEl.style.display = "none";

    try {
      const { data, error } = await sb
        .from("contacts")
        .select("*")
        .eq("season_id", seasonId);
      if (error) throw error;
      contacts = (data || [])
        .filter(c => !!c.reminder_date)
        .sort((a, b) => a.reminder_date.localeCompare(b.reminder_date));
      loadingEl.style.display = "none";
      layoutEl.style.display = "flex";
      renderAgenda();
      renderGrid();
    } catch (err) {
      loadingEl.textContent = `Couldn't load reminders — ${err.message || "check your connection"}.`;
    }
  }

  function renderAgenda() {
    const emptyEl = document.getElementById("agenda-empty-state");
    const listEl = document.getElementById("agenda-list");

    if (contacts.length === 0) {
      emptyEl.style.display = "block";
      listEl.innerHTML = "";
      return;
    }
    emptyEl.style.display = "none";

    const groups = [];
    let currentGroup = null;
    contacts.forEach(c => {
      if (!currentGroup || currentGroup.date !== c.reminder_date) {
        currentGroup = { date: c.reminder_date, contacts: [] };
        groups.push(currentGroup);
      }
      currentGroup.contacts.push(c);
    });

    listEl.innerHTML = groups.map(group => {
      const status = reminderStatus(group.date);
      const rows = group.contacts.map(c => {
        const owner = followupOwnerDisplay(c);
        return `
          <div>
            <button type="button" class="agenda-row-btn" data-toggle="${c.id}">
              <div>
                <div class="agenda-row-name">${escapeHtml(c.name)}${owner ? "; " + escapeHtml(owner) : ""}</div>
              </div>
              <svg class="agenda-row-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
            <div class="agenda-detail" id="agenda-detail-${c.id}">
              <div class="agenda-detail-item">
                <div class="agenda-detail-label">Progress</div>
                <div>${escapeHtml(c.progress || "—")}</div>
              </div>
              <div class="agenda-detail-item">
                <div class="agenda-detail-label">Interested in</div>
                <div>${interestsSummary(c)}</div>
              </div>
              ${c.reminder_note ? `<div class="agenda-detail-item"><div class="agenda-detail-label">Reminder note</div><div>${escapeHtml(c.reminder_note)}</div></div>` : ""}
            </div>
          </div>
        `;
      }).join("");
      return `
        <div class="agenda-group" id="agenda-date-${group.date}">
          <div class="agenda-date-header status-${status}">${formatDateHeader(group.date)}</div>
          <div class="agenda-card">${rows}</div>
        </div>
      `;
    }).join("");
  }

  document.getElementById("agenda-list").addEventListener("click", (e) => {
    const btn = e.target.closest(".agenda-row-btn");
    if (!btn) return;
    const id = btn.dataset.toggle;
    const detail = document.getElementById(`agenda-detail-${id}`);
    const chevron = btn.querySelector(".agenda-row-chevron");
    detail.classList.toggle("open");
    chevron.classList.toggle("open");
  });

  const WEEKDAY_LABELS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

  function renderGridWeekdayHeader() {
    const row = document.getElementById("grid-weekday-row");
    row.innerHTML = WEEKDAY_LABELS.map(d => `<div class="grid-weekday">${d}</div>`).join("");
  }

  function toDateKey(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, "0");
    const d = String(date.getDate()).padStart(2, "0");
    return `${y}-${m}-${d}`;
  }

  function renderGrid() {
    const label = document.getElementById("grid-month-label");
    label.textContent = currentMonthDate.toLocaleDateString(undefined, { month: "long", year: "numeric" });

    const remindersByDate = {};
    contacts.forEach(c => {
      if (!remindersByDate[c.reminder_date]) remindersByDate[c.reminder_date] = [];
      remindersByDate[c.reminder_date].push(c);
    });

    const year = currentMonthDate.getFullYear();
    const month = currentMonthDate.getMonth();
    const firstOfMonth = new Date(year, month, 1);
    const startOffset = firstOfMonth.getDay(); // 0 = Sunday
    const gridStart = new Date(year, month, 1 - startOffset);

    const todayKey = toDateKey(new Date());
    const weeksEl = document.getElementById("grid-weeks");
    let html = "";
    for (let week = 0; week < 6; week++) {
      html += `<div class="grid-week-row">`;
      for (let day = 0; day < 7; day++) {
        const cellDate = new Date(gridStart);
        cellDate.setDate(gridStart.getDate() + week * 7 + day);
        const key = toDateKey(cellDate);
        const isOtherMonth = cellDate.getMonth() !== month;
        const isToday = key === todayKey;
        const dayReminders = remindersByDate[key] || [];

        let pillsHtml = "";
        const visible = dayReminders.slice(0, 1);
        visible.forEach(c => {
          const status = reminderStatus(c.reminder_date);
          const owner = followupOwnerDisplay(c);
          pillsHtml += `<div class="grid-day-pill status-${status}">${escapeHtml(c.name)}${owner ? "; " + escapeHtml(owner) : ""}</div>`;
        });
        if (dayReminders.length > 0) {
          const dotsHtml = dayReminders.slice(0, 3).map(c => {
            const status = reminderStatus(c.reminder_date);
            return `<span class="grid-day-dot status-${status}"></span>`;
          }).join("");
          pillsHtml = `<div>${dotsHtml}</div>` + pillsHtml;
        }
        if (dayReminders.length > visible.length) {
          pillsHtml += `<div class="grid-day-more">+${dayReminders.length - visible.length} more</div>`;
        }

        html += `
          <div class="grid-day-cell ${isOtherMonth ? "other-month" : ""} ${isToday ? "is-today" : ""}" data-date="${key}">
            <span class="grid-day-number">${cellDate.getDate()}</span>
            ${pillsHtml}
          </div>
        `;
      }
      html += `</div>`;
      // Stop rendering extra trailing weeks that are entirely outside the month
      const weekEndDate = new Date(gridStart);
      weekEndDate.setDate(gridStart.getDate() + week * 7 + 6);
      if (weekEndDate.getMonth() !== month && weekEndDate > firstOfMonth) {
        break;
      }
    }
    weeksEl.innerHTML = html;
  }

  document.getElementById("grid-weeks").addEventListener("click", (e) => {
    const cell = e.target.closest(".grid-day-cell");
    if (!cell) return;
    const key = cell.dataset.date;
    const target = document.getElementById(`agenda-date-${key}`);
    if (target) {
      target.scrollIntoView({ behavior: "smooth", block: "start" });
      target.style.outline = "2px solid var(--accent)";
      setTimeout(() => { target.style.outline = "none"; }, 1200);
    } else {
      showBanner("No reminders on that date.", false);
    }
  });

  document.getElementById("grid-prev-btn").addEventListener("click", () => {
    currentMonthDate.setMonth(currentMonthDate.getMonth() - 1);
    renderGrid();
  });
  document.getElementById("grid-next-btn").addEventListener("click", () => {
    currentMonthDate.setMonth(currentMonthDate.getMonth() + 1);
    renderGrid();
  });
  document.getElementById("grid-today-btn").addEventListener("click", () => {
    currentMonthDate = new Date();
    currentMonthDate.setDate(1);
    renderGrid();
  });

  renderGridWeekdayHeader();

  const authGate = document.getElementById("auth-gate");
  const appContent = document.getElementById("app-content");
  const gateForm = document.getElementById("gate-form");
  const gateSubmitBtn = document.getElementById("gate-submit-btn");
  const gateError = document.getElementById("gate-error");

  async function unlockDashboard() {
    authGate.style.display = "none";
    appContent.style.display = "block";
    updateAdminUI();
    await Promise.all([loadSeasonContext(), loadReminders()]);
  }

  gateForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("gate-email").value.trim();
    const password = document.getElementById("gate-password").value;

    gateSubmitBtn.disabled = true;
    gateSubmitBtn.textContent = "Signing in...";
    gateError.style.display = "none";

    try {
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) {
        gateError.textContent = "Incorrect email or password.";
        gateError.style.display = "block";
        return;
      }
      isSignedIn = true;
      isAdmin = getIsAdminFromSession(data.session);
      showPageLoader();
      await unlockDashboard();
      showBanner(isAdmin ? "Signed in as admin" : "Signed in as member", false);
    } catch (err) {
      gateError.textContent = "Couldn't sign in — check your connection and try again.";
      gateError.style.display = "block";
    } finally {
      gateSubmitBtn.disabled = false;
      gateSubmitBtn.textContent = "Sign in";
      hidePageLoader();
    }
  });

  sb.auth.onAuthStateChange((event, session) => {
    if (event === "SIGNED_OUT") return;
    isSignedIn = !!session;
    isAdmin = getIsAdminFromSession(session);
    updateAdminUI();
  });

  async function initAuthState() {
    try {
      const { data } = await sb.auth.getSession();
      isSignedIn = !!data.session;
      isAdmin = getIsAdminFromSession(data.session);
      if (isSignedIn) {
        await unlockDashboard();
      } else {
        authGate.style.display = "flex";
      }
    } finally {
      hidePageLoader();
    }
  }

  backLink.addEventListener("click", () => showPageLoader());

  initAuthState();

  setTimeout(() => {
    const loader = document.getElementById("page-loader");
    if (loader && !loader.classList.contains("hide")) {
      loader.innerHTML = `<div style="max-width:320px; text-align:center; padding:20px; font-size:14px; color:#333;">
        This is taking longer than expected.<br><br>
        <button onclick="window.location.reload()" style="padding:10px 20px; border-radius:10px; border:none; background:#A8452F; color:white; font-weight:600;">Reload</button>
      </div>`;
      loader.style.background = "#fff";
    }
  }, 8000);
</script>
</body>
</html>
