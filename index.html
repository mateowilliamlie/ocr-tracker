<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OCR — We Are Here</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #F4F5F7;
    --surface: #FFFFFF;
    --surface-2: #F9FAFB;
    --text: #1A1D23;
    --text-muted: #6B7280;
    --border: #E2E4E9;
    --accent: #3730A3;
    --accent-hover: #2E2789;
    --success: #15803D;
    --success-bg: #DCFCE7;
    --danger: #B91C1C;
    --danger-bg: #FEE2E2;
    --warn: #B45309;
    --warn-bg: #FEF3C7;
    --info: #1D4ED8;
    --info-bg: #DBEAFE;
    --radius: 10px;
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    padding: 24px 16px 64px;
  }

  main {
    max-width: 760px;
    margin: 0 auto;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 20px;
  }

  header .title {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  header .subtitle {
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  button {
    font-family: var(--font);
    font-size: 14px;
    cursor: pointer;
  }

  #open-add {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: var(--radius);
    padding: 10px 18px;
    font-weight: 500;
    white-space: nowrap;
  }

  #open-add:hover { background: var(--accent-hover); }

  #confirm-banner {
    display: none;
    padding: 10px 14px;
    border-radius: var(--radius);
    font-size: 14px;
    margin-bottom: 16px;
    background: var(--success-bg);
    color: var(--success);
  }

  #confirm-banner.error {
    background: var(--danger-bg);
    color: var(--danger);
  }

  .toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
  }

  #search-input {
    flex: 1;
    font-family: var(--font);
    font-size: 14px;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--text);
  }

  #search-input:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  #sort-select {
    font-family: var(--font);
    font-size: 14px;
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--text);
  }

  .board {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .col-headers {
    display: grid;
    grid-template-columns: 2fr 1.4fr 1.8fr 28px;
    gap: 8px;
    padding: 10px 14px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-muted);
    background: var(--surface-2);
  }

  .row-wrap {
    border-top: 1px solid var(--border);
  }

  .row {
    display: grid;
    grid-template-columns: 2fr 1.4fr 1.8fr 28px;
    gap: 8px;
    align-items: center;
    padding: 12px 14px;
  }

  .row .name {
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
  }

  .row .connector {
    font-size: 13px;
    color: var(--text-muted);
  }

  .row select.reminder-select {
    width: 100%;
    font-family: var(--font);
    font-size: 12px;
    padding: 5px 6px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface-2);
    color: var(--text);
  }

  .row select.reminder-select.has-reminder-overdue {
    background: var(--danger-bg);
    color: var(--danger);
    border-color: transparent;
  }

  .row select.reminder-select.has-reminder-soon {
    background: var(--warn-bg);
    color: var(--warn);
    border-color: transparent;
  }

  .row select.reminder-select.has-reminder-future {
    background: var(--info-bg);
    color: var(--info);
    border-color: transparent;
  }

  .row .reminder-date-input {
    width: 100%;
    font-family: var(--font);
    font-size: 12px;
    padding: 5px 6px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface-2);
    color: var(--text);
  }

  .toggle-btn {
    font-family: var(--font);
    font-size: 13px;
    padding: 9px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--text-muted);
    white-space: nowrap;
  }

  .toggle-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }

  .chevron {
    background: none;
    border: none;
    font-size: 15px;
    color: var(--text-muted);
    transition: transform 0.15s ease;
    padding: 4px;
    line-height: 1;
  }

  .chevron.open { transform: rotate(180deg); }

  .detail {
    display: none;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px 20px;
    padding: 6px 14px 18px;
    background: var(--surface-2);
    font-size: 13px;
  }

  .detail.open { display: grid; }

  .detail .field-label {
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 2px;
  }

  .empty-state {
    padding: 32px 14px;
    text-align: center;
    color: var(--text-muted);
    font-size: 14px;
  }

  dialog {
    border: none;
    border-radius: var(--radius);
    padding: 0;
    width: 100%;
    max-width: 420px;
  }

  dialog::backdrop {
    background: rgba(0, 0, 0, 0.4);
  }

  #add-form {
    padding: 20px;
  }

  #add-form h2 {
    margin: 0 0 16px;
    font-size: 17px;
  }

  .field {
    margin-bottom: 12px;
  }

  .field label {
    display: block;
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 4px;
  }

  .field input,
  .field textarea {
    width: 100%;
    font-family: var(--font);
    font-size: 14px;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
  }

  .field input:focus,
  .field textarea:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  .row-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .form-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 16px;
  }

  #cancel-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 16px;
    color: var(--text);
  }

  #submit-btn {
    background: var(--accent);
    border: none;
    border-radius: 8px;
    padding: 9px 16px;
    color: white;
    font-weight: 500;
  }

  #submit-btn:disabled {
    opacity: 0.6;
    cursor: default;
  }

  .admin-area {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .admin-status {
    font-size: 12px;
    color: var(--text-muted);
  }

  #login-error {
    display: none;
    font-size: 13px;
    color: var(--danger);
    margin-bottom: 12px;
  }

  .detail-actions {
    grid-column: 1 / -1;
    margin-top: 6px;
  }

  .delete-btn {
    background: none;
    border: 1px solid var(--danger);
    color: var(--danger);
    border-radius: 8px;
    padding: 6px 14px;
    font-size: 12px;
  }

  @media (max-width: 520px) {
    .col-headers, .row { grid-template-columns: 1.6fr 1.1fr 1.4fr 24px; }
    .detail { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <div class="title">OCR</div>
      <div class="subtitle">We Are Here · 2026/27</div>
    </div>
    <div class="admin-area" id="admin-area"></div>
  </header>

  <div class="toolbar" style="justify-content: flex-end; margin-bottom: 4px;">
    <button id="open-add">+ New</button>
  </div>

  <div id="confirm-banner"></div>

  <div class="toolbar">
    <input id="search-input" type="text" placeholder="Search by name" />
    <select id="sort-select">
      <option value="recent">Most recent</option>
      <option value="reminder">Soonest reminder</option>
    </select>
    <button id="followups-toggle" class="toggle-btn">Follow-ups only</button>
  </div>

  <div class="board">
    <div class="col-headers">
      <span>Name</span><span>Connected by</span><span>Reminder</span><span></span>
    </div>
    <div id="rows"></div>
    <div id="empty-state" class="empty-state" style="display:none;"></div>
  </div>

  <dialog id="login-dialog">
    <form id="login-form" style="padding: 20px;">
      <h2 style="margin: 0 0 16px; font-size: 17px;">Admin login</h2>
      <div id="login-error"></div>
      <div class="field">
        <label for="l-email">Email</label>
        <input id="l-email" name="email" type="email" required />
      </div>
      <div class="field">
        <label for="l-password">Password</label>
        <input id="l-password" name="password" type="password" required />
      </div>
      <div class="form-actions">
        <button type="button" id="login-cancel-btn">Cancel</button>
        <button type="submit" id="login-submit-btn">Sign in</button>
      </div>
    </form>
  </dialog>

  <dialog id="add-dialog">
    <form id="add-form">
      <h2>Add a contact</h2>

      <div class="field">
        <label for="f-name">Name *</label>
        <input id="f-name" name="name" type="text" required />
      </div>

      <div class="row-2">
        <div class="field">
          <label for="f-nationality">Nationality</label>
          <input id="f-nationality" name="nationality" type="text" />
        </div>
        <div class="field">
          <label for="f-course">Course</label>
          <input id="f-course" name="course" type="text" />
        </div>
      </div>

      <div class="field">
        <label for="f-connector">Connected by</label>
        <input id="f-connector" name="connector" type="text" placeholder="Which OCR member reached out" />
      </div>

      <div class="row-2">
        <div class="field">
          <label for="f-age">Age</label>
          <input id="f-age" name="age" type="number" min="0" />
        </div>
        <div class="field">
          <label for="f-year">Year</label>
          <input id="f-year" name="year" type="text" placeholder="e.g. Year 1" />
        </div>
      </div>

      <div class="field">
        <label for="f-birthday">Birthday</label>
        <input id="f-birthday" name="birthday" type="date" />
      </div>

      <div class="row-2">
        <div class="field">
          <label for="f-reminder-date">Reminder date</label>
          <input id="f-reminder-date" name="reminder_date" type="date" />
        </div>
        <div class="field">
          <label for="f-reminder-note">Reminder note</label>
          <input id="f-reminder-note" name="reminder_note" type="text" placeholder="Follow up about..." />
        </div>
      </div>

      <div class="field">
        <label for="f-other">Other</label>
        <textarea id="f-other" name="other" rows="2"></textarea>
      </div>

      <div class="form-actions">
        <button type="button" id="cancel-btn">Cancel</button>
        <button type="submit" id="submit-btn">Save contact</button>
      </div>
    </form>
  </dialog>
</main>

<script>
  const SUPABASE_URL = "https://xyoniqfmujidoxpgcjlo.supabase.co";
  const SUPABASE_KEY = "sb_publishable_7Gl5gI5XAsMWxNLreYoMvA__2y-gpCC";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const dialog = document.getElementById("add-dialog");
  const openBtn = document.getElementById("open-add");
  const cancelBtn = document.getElementById("cancel-btn");
  const form = document.getElementById("add-form");
  const submitBtn = document.getElementById("submit-btn");
  const banner = document.getElementById("confirm-banner");
  const rowsEl = document.getElementById("rows");
  const emptyStateEl = document.getElementById("empty-state");
  const searchInput = document.getElementById("search-input");
  const sortSelect = document.getElementById("sort-select");
  const followupsToggle = document.getElementById("followups-toggle");
  const adminArea = document.getElementById("admin-area");
  const loginDialog = document.getElementById("login-dialog");
  const loginForm = document.getElementById("login-form");
  const loginCancelBtn = document.getElementById("login-cancel-btn");
  const loginSubmitBtn = document.getElementById("login-submit-btn");
  const loginError = document.getElementById("login-error");

  let contacts = [];
  let openDetailId = null;
  let followupsOnly = false;
  let isAdmin = false;
  let pendingDeleteId = null;

  function reminderStatus(dateStr) {
    if (!dateStr) return "none";
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const d = new Date(dateStr + "T00:00:00");
    const diffDays = Math.round((d - today) / 86400000);
    if (diffDays < 0) return "overdue";
    if (diffDays <= 3) return "soon";
    return "future";
  }

  function reminderClass(dateStr) {
    const status = reminderStatus(dateStr);
    if (status === "none") return "";
    return `has-reminder-${status}`;
  }

  function showBanner(message, isError) {
    banner.textContent = message;
    banner.className = isError ? "error" : "";
    banner.style.display = "block";
    clearTimeout(showBanner._timer);
    showBanner._timer = setTimeout(() => { banner.style.display = "none"; }, 4000);
  }

  function formatDate(d) {
    if (!d) return "";
    const dt = new Date(d + "T00:00:00");
    return dt.toLocaleDateString(undefined, { month: "short", day: "numeric" });
  }

  function addDays(n) {
    const d = new Date();
    d.setDate(d.getDate() + n);
    return d.toISOString().slice(0, 10);
  }

  async function loadContacts() {
    const { data, error } = await sb
      .from("contacts")
      .select("*")
      .order("created_at", { ascending: false });

    if (error) {
      showBanner(`Couldn't load contacts — ${error.message}`, true);
      return;
    }
    contacts = data;
    render();
  }

  function getFilteredSorted() {
    const q = searchInput.value.trim().toLowerCase();
    let list = contacts.filter(c => c.name.toLowerCase().includes(q));

    if (followupsOnly) {
      list = list.filter(c => !!c.reminder_date);
    }

    if (sortSelect.value === "reminder") {
      list = list.slice().sort((a, b) => {
        if (!a.reminder_date && !b.reminder_date) return 0;
        if (!a.reminder_date) return 1;
        if (!b.reminder_date) return -1;
        return a.reminder_date.localeCompare(b.reminder_date);
      });
    }
    return list;
  }

  function render() {
    const list = getFilteredSorted();
    rowsEl.innerHTML = "";

    if (contacts.length === 0) {
      emptyStateEl.style.display = "block";
      emptyStateEl.textContent = "No contacts yet — add your first one.";
      return;
    }
    if (list.length === 0) {
      emptyStateEl.style.display = "block";
      emptyStateEl.textContent = followupsOnly
        ? "No upcoming follow-ups right now."
        : "No matches for that search.";
      return;
    }
    emptyStateEl.style.display = "none";

    list.forEach(c => {
      const wrap = document.createElement("div");
      wrap.className = "row-wrap";

      const isOpen = openDetailId === c.id;

      wrap.innerHTML = `
        <div class="row">
          <span class="name" data-toggle="${c.id}">${escapeHtml(c.name)}</span>
          <span class="connector">${escapeHtml(c.connector || "—")}</span>
          <select class="reminder-select ${reminderClass(c.reminder_date)}" data-id="${c.id}">
            ${reminderOptionsHtml(c)}
          </select>
          <button class="chevron ${isOpen ? "open" : ""}" data-toggle="${c.id}" aria-label="Toggle details">⌄</button>
        </div>
        <div class="detail ${isOpen ? "open" : ""}" id="detail-${c.id}">
          ${detailFieldsHtml(c)}
        </div>
      `;
      rowsEl.appendChild(wrap);
    });
  }

  function reminderOptionsHtml(c) {
    const opts = [];
    if (c.reminder_date) {
      opts.push(`<option value="current" selected>${formatDate(c.reminder_date)}</option>`);
      opts.push(`<option value="none">Clear reminder</option>`);
    } else {
      opts.push(`<option value="none" selected>No reminder</option>`);
    }
    opts.push(`<option value="tomorrow">Tomorrow</option>`);
    opts.push(`<option value="3days">In 3 days</option>`);
    opts.push(`<option value="1week">In 1 week</option>`);
    opts.push(`<option value="custom">Custom date…</option>`);
    return opts.join("");
  }

  function detailFieldsHtml(c) {
    const fields = [
      ["Nationality", c.nationality],
      ["Course", c.course],
      ["Age", c.age],
      ["Year", c.year],
      ["Birthday", c.birthday ? formatDate(c.birthday) : ""],
      ["Reminder note", c.reminder_note],
      ["Other", c.other]
    ];
    const fieldsHtml = fields.map(([label, value]) => `
      <div>
        <div class="field-label">${label}</div>
        <div>${escapeHtml(value || "—")}</div>
      </div>
    `).join("");

    const actionsHtml = isAdmin ? `
      <div class="detail-actions">
        <button class="delete-btn" data-delete="${c.id}">
          ${pendingDeleteId === c.id ? "Click again to confirm" : "Delete contact"}
        </button>
      </div>
    ` : "";

    return fieldsHtml + actionsHtml;
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, m => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[m]));
  }

  async function deleteContact(id) {
    const { error } = await sb.from("contacts").delete().eq("id", id);
    if (error) {
      showBanner(`Couldn't delete — ${error.message}`, true);
      return;
    }
    showBanner("Contact deleted", false);
    pendingDeleteId = null;
    openDetailId = null;
    await loadContacts();
  }

  rowsEl.addEventListener("click", (e) => {
    const delBtn = e.target.closest("[data-delete]");
    if (delBtn) {
      const id = delBtn.dataset.delete;
      if (pendingDeleteId === id) {
        deleteContact(id);
      } else {
        pendingDeleteId = id;
        render();
        clearTimeout(rowsEl._deleteTimer);
        rowsEl._deleteTimer = setTimeout(() => { pendingDeleteId = null; render(); }, 3000);
      }
      return;
    }

    const toggle = e.target.closest("[data-toggle]");
    if (!toggle) return;
    const id = toggle.dataset.toggle;
    openDetailId = openDetailId === id ? null : id;
    render();
  });

  function openCustomDatePicker(select, id) {
    const dateInput = document.createElement("input");
    dateInput.type = "date";
    dateInput.className = "reminder-date-input";
    select.replaceWith(dateInput);
    dateInput.focus();
    if (dateInput.showPicker) {
      try { dateInput.showPicker(); } catch (err) { /* fall back to default click behavior */ }
    }

    let committed = false;

    dateInput.addEventListener("change", async () => {
      committed = true;
      const { error } = await sb.from("contacts")
        .update({ reminder_date: dateInput.value || null })
        .eq("id", id);
      if (error) {
        showBanner(`Couldn't update reminder — ${error.message}`, true);
        return;
      }
      showBanner("Reminder updated", false);
      await loadContacts();
    });

    dateInput.addEventListener("blur", () => {
      if (!committed) render();
    });
  }

  rowsEl.addEventListener("change", async (e) => {
    const select = e.target.closest(".reminder-select");
    if (!select) return;
    const id = select.dataset.id;
    const value = select.value;

    if (value === "custom") {
      openCustomDatePicker(select, id);
      return;
    }

    let reminder_date;
    if (value === "current") return;
    if (value === "none") reminder_date = null;
    else if (value === "tomorrow") reminder_date = addDays(1);
    else if (value === "3days") reminder_date = addDays(3);
    else if (value === "1week") reminder_date = addDays(7);

    const { error } = await sb.from("contacts").update({ reminder_date }).eq("id", id);
    if (error) {
      showBanner(`Couldn't update reminder — ${error.message}`, true);
      return;
    }
    showBanner("Reminder updated", false);
    await loadContacts();
  });

  searchInput.addEventListener("input", render);
  sortSelect.addEventListener("change", render);

  followupsToggle.addEventListener("click", () => {
    followupsOnly = !followupsOnly;
    followupsToggle.classList.toggle("active", followupsOnly);
    render();
  });

  openBtn.addEventListener("click", () => {
    form.reset();
    dialog.showModal();
  });

  cancelBtn.addEventListener("click", () => dialog.close());

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const name = form.name.value.trim();
    if (!name) {
      form.name.focus();
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Saving...";

    const payload = {
      name,
      nationality: form.nationality.value.trim() || null,
      course: form.course.value.trim() || null,
      connector: form.connector.value.trim() || null,
      age: form.age.value ? parseInt(form.age.value, 10) : null,
      year: form.year.value.trim() || null,
      birthday: form.birthday.value || null,
      other: form.other.value.trim() || null,
      reminder_date: form.reminder_date.value || null,
      reminder_note: form.reminder_note.value.trim() || null
    };

    const { data, error } = await sb.from("contacts").insert(payload).select();

    submitBtn.disabled = false;
    submitBtn.textContent = "Save contact";

    if (error) {
      showBanner(`Couldn't save — ${error.message}`, true);
      return;
    }

    dialog.close();
    showBanner(`${name} added`, false);
    contacts.unshift(data[0]);
    render();
  });

  function updateAdminUI() {
    adminArea.innerHTML = isAdmin
      ? `<span class="admin-status">Signed in as admin</span><button id="signout-btn" class="toggle-btn">Sign out</button>`
      : `<button id="admin-login-btn" class="toggle-btn">Admin login</button>`;
  }

  adminArea.addEventListener("click", async (e) => {
    if (e.target.id === "admin-login-btn") {
      loginForm.reset();
      loginError.style.display = "none";
      loginDialog.showModal();
    } else if (e.target.id === "signout-btn") {
      await sb.auth.signOut();
      showBanner("Signed out", false);
    }
  });

  loginCancelBtn.addEventListener("click", () => loginDialog.close());

  loginForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = loginForm.email.value.trim();
    const password = loginForm.password.value;

    loginSubmitBtn.disabled = true;
    loginSubmitBtn.textContent = "Signing in...";
    loginError.style.display = "none";

    const { error } = await sb.auth.signInWithPassword({ email, password });

    loginSubmitBtn.disabled = false;
    loginSubmitBtn.textContent = "Sign in";

    if (error) {
      loginError.textContent = "Incorrect email or password.";
      loginError.style.display = "block";
      return;
    }

    loginDialog.close();
    showBanner("Signed in as admin", false);
  });

  sb.auth.onAuthStateChange((event, session) => {
    isAdmin = !!session;
    updateAdminUI();
    render();
  });

  async function initAdminState() {
    const { data } = await sb.auth.getSession();
    isAdmin = !!data.session;
    updateAdminUI();
  }

  initAdminState();
  loadContacts();
</script>
</body>
</html>
